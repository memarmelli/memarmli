<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="معمار ملی؛ آرشیو تصویری دانش‌آموختگان معماری دانشگاه شهید بهشتی. هر ورودی، یک قاب از خاطره‌های مشترک.">
  <title>معمار ملی — دانش‌آموختگان معماری</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261025-periods-2">
  <script src="cohorts.js?v=20261024-search-1" defer></script>
  <script src="app.js?v=20261025-periods-2" defer></script>
</head>
<body>
  <a class="skip-link" href="#archive">رفتن به ورودی‌ها</a>
  <div class="page-shell" id="top">
    <header class="masthead" aria-label="معمار ملی">
      <div class="brand university" aria-label="جای لوگوی دانشگاه شهید بهشتی">
        <span class="logo-slot university-slot" aria-hidden="true">ش<span>ب</span></span>
        <div class="brand-copy"><span>دانشگاه شهید بهشتی</span><small>جای لوگوی دانشگاه</small></div>
      </div>
      <div class="masthead-title">
        <h1>معمار ملی<span class="title-dot" aria-hidden="true">.</span></h1>
        <p>دانش‌آموختگان معماری دانشگاه شهید بهشتی</p>
      </div>
      <div class="brand artinext" aria-label="جای لوگوی شرکت ارتینکست">
        <div class="artinext-wordmark" lang="en" dir="ltr">artinext<span aria-hidden="true">↗</span></div>
        <small>جای لوگوی ارتینکست</small>
      </div>
    </header>

    <main id="archive">
      <nav class="archive-nav" aria-label="انتخاب سال ورودی">
        <form id="year-search" class="year-search" role="search" aria-label="جست‌وجوی سال ورودی" novalidate>
          <label for="year-input">سال ورودی</label>
          <div class="year-search-controls">
            <input id="year-input" name="year" type="text" inputmode="numeric" maxlength="4" pattern="[0-9۰-۹٠-٩]{4}" placeholder="مثلاً ۱۳۹۰" autocomplete="off" aria-describedby="search-status">
            <button type="submit">پیدا کن <span aria-hidden="true">↗</span></button>
            <button id="clear-search" class="clear-search" type="button" hidden>همهٔ ورودی‌ها</button>
          </div>
          <p id="search-status" class="search-status" role="status" aria-live="polite" hidden></p>
        </form>
        <div id="year-nav" class="year-nav"></div>
      </nav>

      <section id="cohorts" class="cohorts" aria-label="تصاویر گروهی ورودی‌ها"></section>
      <noscript><p class="noscript">برای نمایش آرشیو ورودی‌ها، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>

    </main>

    <footer>
      <div class="footer-brand">معمار ملی<span aria-hidden="true">.</span></div>
      <p class="demo-note">نسخهٔ نمایشی · سال‌ها و تصاویر نمونه‌اند. <a href="https://collego.edu.tw/Highschool/DepartmentIntro?dept_id=006009" target="_blank" rel="noopener noreferrer">منبع تصویر نمونه ↗</a></p>
      <a href="#top" class="back-top">بازگشت به بالا <span aria-hidden="true">↑</span></a>
    </footer>
  </div>

  <dialog id="photo-dialog" aria-labelledby="dialog-title">
    <div class="dialog-bar"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" aria-label="بستن تصویر">بستن <span aria-hidden="true">×</span></button></div>
    <img id="dialog-image" alt="">
    <p class="dialog-caption">تصویر نمونه برای نمایش طرح؛ عکس واقعی هر ورودی جایگزین می‌شود.</p>
  </dialog>
</body>
</html>
