<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="معمار ملی، آرشیو دانش‌آموختگان معماری دانشگاه ملی (شهید بهشتی)." data-i18n-attr="content:site.description">
  <title>معمار ملی، دانش‌آموختگان معماری</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/NotoKufiArabic-fa.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261112-brand-1">
  <script src="i18n.js?v=20261028-share-1"></script>
  <script src="data.js" defer></script>
  <script src="career.js?v=20261025-more-1" defer></script>
  <script src="lineage.js?v=20261025-more-1" defer></script>
  <script src="portrait.js?v=20261028-share-1" defer></script>
  <script src="app.js?v=20261028-share-1" defer></script>
  <script src="sketch.js?v=20261028-classic-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#archive" data-i18n="skip.archive">رفتن به ورودی‌ها</a>
  <div class="page-shell" id="top">
    <header class="masthead" data-i18n-attr="aria-label:site.name">
      <a class="lang-switch masthead-lang" href="?lang=en" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switchLabel">English</a>
      <img class="university-logo" src="assets/university-original.png" alt="دانشگاه شهید بهشتی" data-i18n-attr="alt:logo.sbu" width="225" height="225">
      <div class="masthead-title">
        <h1><img class="melli-logo" src="assets/melli-original.png" alt="معمار ملی" data-i18n-attr="alt:site.name" width="1500" height="643"></h1>
        <p data-i18n="site.tagline">دانش‌آموختگان معماری دانشگاه ملی (شهید بهشتی)</p>
      </div>
      <img class="national-logo" src="assets/melli-university-original.jpg" alt="دانشگاه ملی ایران" data-i18n-attr="alt:logo.national" width="180" height="222">
    </header>

    <main id="archive">
      <div class="archive-nav">
        <nav id="year-nav" class="year-nav" data-i18n-attr="aria-label:nav.years"></nav>
        <div class="archive-tools">
          <div class="view-switch" role="group" data-i18n-attr="aria-label:view.label">
            <button type="button" data-view="faces" aria-pressed="true" data-i18n="view.faces">چهره‌ها</button>
            <button type="button" data-view="photo" aria-pressed="false" data-i18n="view.photo">عکس گروهی</button>
          </div>
          <a id="stats-link" class="stats-link" href="stats.html" data-href="stats.html" data-i18n-attr="aria-label:stats.linkLabel"><span class="stats-icon" aria-hidden="true"></span><span data-i18n="stats.link">آمار</span></a>
        </div>
      </div>

      <div class="archive-layout">
        <aside class="lineage-panel" data-sketch="frame" aria-labelledby="lineage-title">
          <h2 id="lineage-title" data-i18n="lineage.title">نسل من</h2>
          <p class="lineage-help" data-i18n="lineage.help"></p>
          <form id="lineage-form" class="lineage-form" novalidate>
            <label for="lineage-input" data-i18n="lineage.label">شماره‌ی دانشجویی</label>
            <input id="lineage-input" name="student" type="text" inputmode="numeric" maxlength="12" data-i18n-attr="placeholder:lineage.placeholder" autocomplete="off" aria-describedby="lineage-status">
            <div class="lineage-actions">
              <button type="submit" data-i18n="lineage.submit">نمایش نسل</button>
              <button id="lineage-clear" class="lineage-clear" type="button" data-i18n="lineage.clear" hidden>پاک کردن</button>
            </div>
          </form>
          <p id="lineage-status" class="lineage-status" role="status" aria-live="polite" hidden></p>
          <div id="lineage-share" class="lineage-share" hidden>
            <a id="lineage-telegram" class="lineage-share-link" target="_blank" rel="noopener"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M21.5 3.5 2.8 10.7c-.9.4-.9 1.6 0 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6l3-15.6c.1-.9-.7-1.6-1.6-1.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="m7.6 14 10.2-7.2-7.6 8.6"/></svg><span data-i18n="lineage.shareTelegram">اشتراک در Telegram</span></a>
            <button id="lineage-copy" class="lineage-share-link" type="button" data-i18n="lineage.copy">کپی پیوند</button>
          </div>
          <ol id="lineage-list" class="lineage-list" hidden></ol>
        </aside>
        <div class="archive-main">
          <form id="filters" class="filters" data-sketch="frame" role="search" data-i18n-attr="aria-label:filter.title">
            <div class="filters-row">
              <label class="filter-search"><span data-i18n="filter.searchLabel">جست‌وجو</span><input id="filter-search" type="search" autocomplete="off" data-i18n-attr="placeholder:filter.search"></label>
              <label><span data-i18n="filter.specialty">تخصص</span><select id="filter-specialty"></select></label>
              <label><span data-i18n="filter.experience">سابقه‌ی کار</span><select id="filter-experience"></select></label>
              <label><span data-i18n="sort.label">ترتیب</span><select id="filter-sort"></select></label>
            </div>
            <div id="filter-extra" class="filters-row" hidden>
              <label><span data-i18n="filter.software">نرم‌افزار</span><select id="filter-software"></select></label>
              <label><span data-i18n="filter.country">کشور</span><select id="filter-country"></select></label>
              <label><span data-i18n="filter.city">شهر</span><select id="filter-city"></select></label>
              <label><span data-i18n="filter.employer">محل کار</span><select id="filter-employer"></select></label>
              <label><span data-i18n="filter.degree">آخرین مدرک</span><select id="filter-degree"></select></label>
              <label class="filter-check"><input id="filter-open" type="checkbox"><span data-i18n="filter.open">آماده‌ی همکاری</span></label>
              <label class="filter-check"><input id="filter-mentor" type="checkbox"><span data-i18n="filter.mentor">آماده‌ی منتورینگ</span></label>
            </div>
            <div class="filters-foot">
              <button id="filter-more" class="filter-more" type="button" aria-expanded="false" aria-controls="filter-extra" data-i18n="filter.more">فیلترهای بیشتر</button>
              <p id="filter-count" class="filter-count" role="status" aria-live="polite"></p>
              <button id="filter-clear" class="filter-clear" type="button" data-i18n="filter.clear" hidden>پاک کردن فیلتر</button>
            </div>
          </form>
          <p id="filter-empty" class="filter-empty" data-i18n="filter.none" hidden></p>
        <section id="cohorts" class="cohorts" data-i18n-attr="aria-label:archive.aria">
          <svg id="lineage-lines" class="lineage-lines" aria-hidden="true" focusable="false"></svg>
        </section>
        </div>
      </div>
      <section class="community" aria-labelledby="community-title">
        <div class="community-card" data-sketch="frame">
          <div class="community-art" data-sketch-art="tools"></div>
          <div class="community-text">
            <p class="community-kicker" data-i18n="community.kicker">همراهی دانش‌آموختگان</p>
            <h2 id="community-title" data-i18n="community.title">آرشیوی که با هم ساخته می‌شود</h2>
            <p data-i18n="community.text"></p>
            <dl class="community-stats">
              <div><dt data-i18n="community.people">دانش‌آموخته</dt><dd id="community-people"></dd></div>
              <div><dt data-i18n="community.years">ورودی</dt><dd id="community-years"></dd></div>
            </dl>
            <a class="community-cta" href="https://t.me/memar_mli_bot" target="_blank" rel="noopener"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M21.5 3.5 2.8 10.7c-.9.4-.9 1.6 0 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6l3-15.6c.1-.9-.7-1.6-1.6-1.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="m7.6 14 10.2-7.2-7.6 8.6"/></svg><span data-i18n="community.button">ربات معمار ملی در Telegram</span></a>
          </div>
        </div>
      </section>
      <noscript><p class="noscript">برای نمایش آرشیو ورودی‌ها، جاوااسکریپت مرورگر را فعال کنید. Enable JavaScript to see the intake archive.</p></noscript>
    </main>

    <footer data-sketch="rule">
      <div class="footer-brand"><span data-i18n="site.name">معمار ملی</span><span class="footer-dot" aria-hidden="true">.</span></div>
      <p class="demo-note" data-i18n="footer.demo"></p>
      <div class="footer-actions">
        <div class="artinext" lang="en" dir="ltr">
          <img class="artinext-logo" src="assets/artinext-logo.svg" alt="" width="371" height="228">
          <div class="artinext-name">
            <strong>Artinext</strong>
            <span>Build What's Next</span>
          </div>
        </div>
        <a href="#top" class="back-top"><span data-i18n="footer.top">بازگشت به بالا</span> <span class="back-top-arrow" aria-hidden="true">↑</span></a>
      </div>
    </footer>
  </div>
</body>
</html>
